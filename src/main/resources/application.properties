spring.application.name=pedidos-assistente

server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:60}

app.ia.base-url=${IA_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
app.ia.api-key=${IA_API_KEY}
app.ia.modelo=${IA_MODELO:gemini-flash-lite-latest}
app.ia.max-rodadas=5
app.ia.timeout=30s

app.chat.limite-por-minuto=${CHAT_LIMITE_POR_MINUTO:10}
app.chat.limite-por-dia=${CHAT_LIMITE_POR_DIA:50}
app.chat.mensagens-de-contexto=5
app.chat.janela-de-contexto=30m

app.dados-demo.habilitado=${DADOS_DEMO:false}
app.dados-demo.senha-admin=${ADMIN_SENHA:}
