spring.application.name=pedidos-assistente

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pedidos}
spring.datasource.username=${DB_USERNAME:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-secret-troque-em-producao-com-pelo-menos-32-bytes}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:60}

app.ia.base-url=${IA_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
app.ia.api-key=${IA_API_KEY:}
app.ia.modelo=${IA_MODELO:gemini-flash-lite-latest}
app.ia.max-rodadas=5
app.ia.timeout=30s

app.chat.limite-por-minuto=${CHAT_LIMITE_POR_MINUTO:10}
app.chat.limite-por-dia=${CHAT_LIMITE_POR_DIA:50}
app.chat.mensagens-de-contexto=5
app.chat.janela-de-contexto=30m
