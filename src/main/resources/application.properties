spring.application.name=pedidos-assistente

# Banco de dados (valores padrão batem com o docker-compose.yml; em produção, sobrescreva por variável de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pedidos}
spring.datasource.username=${DB_USERNAME:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos}

# JPA / Hibernate
# update: o Hibernate cria/ajusta as tabelas a partir das entidades (bom para desenvolvimento, não para produção)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desliga o "Open Session in View": consultas ao banco ficam restritas à camada de serviço
spring.jpa.open-in-view=false
