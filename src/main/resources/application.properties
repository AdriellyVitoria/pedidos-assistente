spring.application.name=pedidos-assistente

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pedidos}
spring.datasource.username=${DB_USERNAME:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
